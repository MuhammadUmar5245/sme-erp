{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-xl-4">
    <div class="card mt-4">
      <div class="card-body p-4 text-center">
        <i class="bi bi-shield-lock fs-1" style="color: var(--erp-primary)"></i>
        <h1 class="h5 mt-2">Two-factor verification</h1>
        <p class="text-muted small">Enter the 6-digit code from your authenticator app.</p>
        <form method="post">{% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          {{ form.token }}
          {% for e in form.token.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
          <button class="btn btn-primary w-100 mt-3" type="submit">Verify</button>
        </form>
        <form method="post" action="{% url 'accounts:logout' %}" class="mt-2">{% csrf_token %}
          <button class="btn btn-link btn-sm" type="submit">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
