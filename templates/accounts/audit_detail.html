{% extends "core/generic_detail.html" %}
{% block detail_extra %}
<div class="card">
  <div class="card-header">Changes</div>
  <div class="table-responsive">
    <table class="table table-sm mb-0">
      <thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead>
      <tbody>
      {% for field, values in object.changes.items %}
        <tr><td class="fw-semibold">{{ field }}</td><td class="text-danger small">{{ values.0|default_if_none:"-" }}</td><td class="text-success small">{{ values.1|default_if_none:"-" }}</td></tr>
      {% empty %}<tr><td colspan="3" class="text-muted text-center py-3">No field changes recorded.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
