{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>{{ title }}</h1>
  {% if list_url %}<a class="btn btn-link btn-sm" href="{{ list_url }}"><i class="bi bi-arrow-left"></i> Back to list</a>{% endif %}
</div>
<form method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  <div class="card mb-3">
    <div class="card-body">
      {% include "core/partials/form_fields.html" %}
    </div>
  </div>
  {% block formsets %}{% endblock %}
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ submit_label|default:"Save" }}</button>
    {% if list_url %}<a class="btn btn-outline-secondary" href="{{ list_url }}">Cancel</a>{% endif %}
  </div>
</form>
{% endblock %}
