{% extends "base.html" %}
{% block content %}
<div class="page-header"><h1>Delete {{ object }}</h1></div>
<div class="card">
  <div class="card-body">
    <p>Are you sure you want to delete <strong>{{ object }}</strong>? This action is recorded in the audit log.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger" type="submit"><i class="bi bi-trash"></i> Delete</button>
      <a class="btn btn-outline-secondary" href="javascript:history.back()">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
